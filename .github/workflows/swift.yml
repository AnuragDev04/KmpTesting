name: Build iOS XCFramework

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # DEBUG: This lists all available tasks so you can see what exists.
      # If you don't see "assembleXCFramework" here, you forgot to add iOS targets.
      - name: List all tasks in sharedLogic
        run: ./gradlew :sharedLogic:tasks --all

      # Build the XCFramework (this will create the .xcframework bundle)
      - name: Build XCFramework
        run: ./gradlew :sharedLogic:assembleXCFramework

      # Upload the built framework as a downloadable artifact
      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: sharedLogic-XCFramework
          path: sharedLogic/build/XCFrameworks/**/*
