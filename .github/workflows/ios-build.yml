name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: 'latest-stable'
  IOS_DEPLOYMENT_TARGET: '13.0'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        # List available Xcode versions
        sudo xcode-select -p
        ls /Applications/ | grep -i xcode || true
        # Use default Xcode installation
        echo "Using default Xcode version:"
        xcodebuild -version

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Cache Kotlin/Native prebuilt
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build KMP Shared Framework
      run: |
        echo "Building shared framework..."
        echo "Java version:"
        java -version
        echo "Gradle version:"
        ./gradlew --version
        echo "Starting XCFramework build..."
        ./gradlew :sharedLogic:assembleXCFramework --no-daemon --stacktrace --info
        echo "Checking generated frameworks..."
        find . -name "*.xcframework" -type d
        
    - name: List iOS workspace structure
      run: |
        echo "iOS App structure:"
        ls -la iosApp/
        ls -la iosApp/iosApp.xcodeproj/
        
    - name: Build iOS App (Debug)
      if: ${{ github.event.inputs.build_configuration == 'Debug' || github.event.inputs.build_configuration == '' }}
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -sdk iphonesimulator \
          build

    - name: Build iOS App (Release)
      if: ${{ github.event.inputs.build_configuration == 'Release' }}
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -destination 'generic/platform=iOS Simulator' \
          -sdk iphonesimulator \
          build

    - name: Archive iOS App for Distribution
      run: |
        cd iosApp
        # Build archive for device distribution
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/iosApp.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    # Attempt to create IPA with development signing (will work if certificates exist)
    - name: Export IPA (Development)
      continue-on-error: true
      id: export_ipa
      run: |
        cd iosApp
        # Create export options plist
        cat > export-options.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>development</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>stripSwiftSymbols</key>
          <true/>
          <key>compileBitcode</key>
          <false/>
          <key>uploadBitcode</key>
          <false/>
          <key>uploadSymbols</key>
          <false/>
        </dict>
        </plist>
        EOF
        
        # Try to export the IPA (will fail without certificates, but that's ok)
        if xcodebuild -exportArchive \
          -archivePath build/iosApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export-options.plist \
          -allowProvisioningUpdates; then
          echo "✅ IPA created successfully"
          echo "ipa_created=true" >> $GITHUB_OUTPUT
        else
          echo "⚠️ IPA export failed - certificates not configured"
          echo "ipa_created=false" >> $GITHUB_OUTPUT
        fi

    - name: Verify Build Results
      run: |
        cd iosApp
        echo "=== Build Results ==="
        if [ -d "build/iosApp.xcarchive" ]; then
          echo "✅ Archive: build/iosApp.xcarchive"
          ls -la build/iosApp.xcarchive/
        fi
        
        if [ -f build/*.ipa ]; then
          echo "✅ IPA: $(ls build/*.ipa)"
          ls -la build/*.ipa
        else
          echo "ℹ️  No IPA file (requires iOS certificates for signing)"
        fi

    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        cd iosApp
        ls -la build/
        if [ -d "build/iosApp.xcarchive" ]; then
          echo "Archive contents:"
          ls -la build/iosApp.xcarchive/
        fi
        if [ -f build/*.ipa ]; then
          echo "IPA files:"
          ls -la build/*.ipa
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-${{ github.run_number }}
        path: |
          iosApp/build/iosApp.xcarchive
          iosApp/build/*.ipa
        retention-days: 30

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          iosApp/build/
        retention-days: 7