name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: 'latest-stable'
  IOS_DEPLOYMENT_TARGET: '13.0'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        # List available Xcode versions
        sudo xcode-select -p
        ls /Applications/ | grep -i xcode || true
        # Use default Xcode installation
        echo "Using default Xcode version:"
        xcodebuild -version

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Cache Kotlin/Native prebuilt
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build KMP Shared Framework
      run: |
        echo "Building shared framework..."
        echo "Java version:"
        java -version
        echo "Gradle version:"
        ./gradlew --version
        echo "Starting XCFramework build..."
        ./gradlew :sharedLogic:assembleXCFramework --no-daemon --stacktrace --info
        echo "Checking generated frameworks..."
        find . -name "*.xcframework" -type d
        
    - name: List iOS workspace structure
      run: |
        echo "iOS App structure:"
        ls -la iosApp/
        ls -la iosApp/iosApp.xcodeproj/
        
    - name: Build iOS App (Debug)
      if: ${{ github.event.inputs.build_configuration == 'Debug' || github.event.inputs.build_configuration == '' }}
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -sdk iphonesimulator \
          build

    - name: Build iOS App (Release)
      if: ${{ github.event.inputs.build_configuration == 'Release' }}
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -destination 'generic/platform=iOS Simulator' \
          -sdk iphonesimulator \
          build

    - name: Archive iOS App for Distribution
      run: |
        cd iosApp
        # Build archive for device distribution
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/iosApp.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    # Note: IPA export requires valid code signing certificates
    # For testing/CI purposes, we'll skip the IPA export step
    # To create a signed IPA, you need to:
    # 1. Add iOS certificates as GitHub secrets
    # 2. Configure proper provisioning profiles
    # 3. Use the ios-release.yml workflow for signed builds
    - name: Verify Archive Creation
      run: |
        cd iosApp
        if [ -d "build/iosApp.xcarchive" ]; then
          echo "✅ Archive created successfully"
          ls -la build/iosApp.xcarchive
        else
          echo "❌ Archive creation failed"
          exit 1
        fi

    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        cd iosApp
        ls -la build/
        if [ -d "build/iosApp.xcarchive" ]; then
          echo "Archive contents:"
          ls -la build/iosApp.xcarchive/
        fi

    - name: Upload Archive Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-archive-${{ github.run_number }}
        path: |
          iosApp/build/iosApp.xcarchive
        retention-days: 30

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          iosApp/build/
        retention-days: 7