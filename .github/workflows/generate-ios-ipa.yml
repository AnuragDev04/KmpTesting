name: 📱 iOS IPA Builder (KMP)

# Creates working iOS IPA files from Kotlin Multiplatform projects
# Fixed version - properly embeds SharedLogic framework in IPA
# For Windows developers targeting iOS devices via sideloading

on:
  # Manual trigger - click "Run workflow" button
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: true
        default: 'CareHome'
      bundle_id:
        description: 'Bundle Identifier (reverse domain)'
        required: true
        default: 'com.example.carehome'
      version:
        description: 'Version Number'
        required: true
        default: '1.0.0'

  # Auto-trigger on important changes
  push:
    branches: [ main, master ]
    paths:
      - 'sharedLogic/**'
      - 'iosApp/**'

jobs:
  build-ios-ipa:
    name: 🔨 Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 40
    
    steps:
    # ================================================
    # SETUP AND PREPARATION
    # ================================================
    
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🛠️ Environment Setup
      run: |
        echo "🔧 Setting up build environment..."
        
        # Make gradlew executable
        chmod +x ./gradlew
        
        # Set app configuration from inputs
        APP_NAME="${{ github.event.inputs.app_name || 'CareHome' }}"
        BUNDLE_ID="${{ github.event.inputs.bundle_id || 'com.example.carehome' }}"
        VERSION="${{ github.event.inputs.version || '1.0.0' }}"
        BUILD_NUM="${{ github.run_number }}"
        
        echo "📱 Configuration:"
        echo "  App Name: $APP_NAME"
        echo "  Bundle ID: $BUNDLE_ID" 
        echo "  Version: $VERSION"
        echo "  Build: $BUILD_NUM"
        
        # Export for later steps
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        
        # Display system info
        echo "🖥️ Build System:"
        echo "  Xcode: $(xcodebuild -version | head -1)"
        echo "  Swift: $(xcrun swift --version | head -1)"
        echo "  Java: $(java -version 2>&1 | head -1)"

    # ================================================
    # BUILD KOTLIN MULTIPLATFORM FRAMEWORK
    # ================================================
    
    - name: 🏗️ Build SharedLogic Framework
      run: |
        echo "🔨 Building Kotlin Multiplatform framework..."
        
        # Build the iOS framework using Gradle
        ./gradlew :sharedLogic:assembleXCFramework --stacktrace --no-daemon --warning-mode=all
        
        # Verify framework was created
        echo "🔍 Looking for built framework..."
        
        if find sharedLogic/build -name "SharedLogic.xcframework" -type d | head -1; then
          FRAMEWORK_PATH=$(find sharedLogic/build -name "SharedLogic.xcframework" -type d | head -1)
          echo "✅ Found XCFramework: $FRAMEWORK_PATH"
          
          # Show framework structure
          echo "📂 Framework structure:"
          ls -la "$FRAMEWORK_PATH"
          
          # Export framework path for later use
          echo "FRAMEWORK_PATH=$FRAMEWORK_PATH" >> $GITHUB_ENV
          
        elif find sharedLogic/build -name "SharedLogic.framework" -type d | head -1; then
          FRAMEWORK_PATH=$(find sharedLogic/build -name "SharedLogic.framework" -type d | head -1)
          echo "✅ Found regular Framework: $FRAMEWORK_PATH"
          echo "FRAMEWORK_PATH=$FRAMEWORK_PATH" >> $GITHUB_ENV
          
        else
          echo "❌ No SharedLogic framework found!"
          echo "🔍 Available build outputs:"
          find sharedLogic/build -name "*.framework" -o -name "*.xcframework" | head -10
          exit 1
        fi

    # ================================================
    # CONFIGURE iOS PROJECT
    # ================================================
    
    - name: ⚙️ Configure iOS Project
      run: |
        cd iosApp
        
        echo "📱 Configuring iOS project with user settings..."
        
        # Update Info.plist with user configuration
        cat > iosApp/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>${{ env.APP_NAME }}</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>${{ env.BUNDLE_ID }}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${{ env.APP_NAME }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ env.VERSION }}</string>
            <key>CFBundleVersion</key>
            <string>${{ env.BUILD_NUM }}</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <true/>
                <key>UISceneConfigurations</key>
                <dict/>
            </dict>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationPortraitUpsideDown</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
        </dict>
        </plist>
        EOF
        
        echo "✅ iOS project configured"

    # ================================================
    # BUILD iOS APPLICATION
    # ================================================
    
    - name: 🔨 Build iOS App
      run: |
        cd iosApp
        
        echo "🏗️ Building iOS application..."
        
        # Clean previous builds
        rm -rf build/
        mkdir -p build/output
        
        # Determine correct framework path for embedding
        SHARED_FRAMEWORK_PATH="../${{ env.FRAMEWORK_PATH }}"
        echo "📦 Framework source: $SHARED_FRAMEWORK_PATH"
        
        # Build iOS app without code signing
        echo "🔨 Running xcodebuild..."
        set -o pipefail
        
        xcodebuild clean build \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/DerivedData \
          -allowProvisioningUpdates \
          FRAMEWORK_SEARCH_PATHS="../sharedLogic/build/XCFrameworks/release ../sharedLogic/build/bin/iosArm64/releaseFramework" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          PRODUCT_NAME="${{ env.APP_NAME }}" \
          PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}" \
        | tee build/xcodebuild.log
        
        # Check if build succeeded
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ iOS build failed!"
          echo "📋 Last 30 lines of build log:"
          tail -30 build/xcodebuild.log
          exit 1
        fi
        
        echo "✅ iOS app built successfully"
        
        # Find the built app
        APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
        
        if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
          echo "❌ Built app not found!"
          echo "🔍 Looking for build products:"
          find build/DerivedData -name "*.app" -type d | head -5
          exit 1
        fi
        
        echo "📱 Found app: $APP_PATH"
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        
        # Check current app contents
        echo "📂 Current app contents:"
        ls -la "$APP_PATH"

    # ================================================
    # EMBED SHAREDLOGIC FRAMEWORK
    # ================================================
    
    - name: 📦 Embed SharedLogic Framework
      run: |
        cd iosApp
        
        echo "📦 Embedding SharedLogic framework in app bundle..."
        
        APP_PATH="${{ env.APP_PATH }}"
        FRAMEWORK_SOURCE="../${{ env.FRAMEWORK_PATH }}"
        
        echo "📍 App path: $APP_PATH"
        echo "📍 Framework source: $FRAMEWORK_SOURCE"
        
        # Create Frameworks directory if it doesn't exist
        mkdir -p "$APP_PATH/Frameworks"
        
        # Determine which framework variant to embed for iOS device
        if [[ "$FRAMEWORK_SOURCE" == *".xcframework"* ]]; then
          echo "📦 Handling XCFramework..."
          
          # For XCFramework, find the iOS device framework
          IOS_FRAMEWORK=""
          
          # Look for iOS arm64 framework (device)
          if [ -d "$FRAMEWORK_SOURCE/ios-arm64/SharedLogic.framework" ]; then
            IOS_FRAMEWORK="$FRAMEWORK_SOURCE/ios-arm64/SharedLogic.framework"
            echo "✅ Found iOS arm64 framework"
          elif [ -d "$FRAMEWORK_SOURCE/ios-arm64_x86_64-simulator/SharedLogic.framework" ]; then
            IOS_FRAMEWORK="$FRAMEWORK_SOURCE/ios-arm64_x86_64-simulator/SharedLogic.framework"
            echo "⚠️ Using simulator framework (may not work on device)"
          else
            echo "🔍 Available framework variants:"
            ls -la "$FRAMEWORK_SOURCE/" || true
            echo "❌ No suitable iOS framework found in XCFramework"
            exit 1
          fi
          
          # Copy the iOS framework to app
          echo "📋 Copying framework: $IOS_FRAMEWORK"
          cp -R "$IOS_FRAMEWORK" "$APP_PATH/Frameworks/"
          
        else
          echo "📦 Handling regular .framework..."
          
          # For regular framework, copy directly
          cp -R "$FRAMEWORK_SOURCE" "$APP_PATH/Frameworks/"
        fi
        
        # Verify framework was embedded
        if [ ! -d "$APP_PATH/Frameworks/SharedLogic.framework" ]; then
          echo "❌ Framework embedding failed!"
          echo "🔍 App Frameworks directory:"
          ls -la "$APP_PATH/Frameworks/" || echo "Frameworks directory not found"
          exit 1
        fi
        
        echo "✅ SharedLogic framework embedded successfully"
        
        # Show final app structure
        echo "📂 Final app bundle structure:"
        ls -la "$APP_PATH"
        echo "📂 Embedded frameworks:"
        ls -la "$APP_PATH/Frameworks"
        
        # Verify framework binary exists
        if [ -f "$APP_PATH/Frameworks/SharedLogic.framework/SharedLogic" ]; then
          echo "✅ Framework binary confirmed"
        else
          echo "⚠️ Framework binary not found"
          ls -la "$APP_PATH/Frameworks/SharedLogic.framework"
        fi
    # ================================================
    # CREATE IPA FILE
    # ================================================
    
    - name: 📦 Create IPA Package
      id: create-ipa
      run: |
        cd iosApp
        
        echo "📦 Creating IPA file..."
        
        APP_PATH="${{ env.APP_PATH }}"
        
        # Create IPA structure (standard iOS app package format)
        mkdir -p ipa_temp/Payload
        
        # Copy app bundle to Payload directory
        cp -R "$APP_PATH" ipa_temp/Payload/
        
        # Generate IPA filename with timestamp
        TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
        IPA_NAME="${{ env.APP_NAME }}_v${{ env.VERSION }}_b${{ env.BUILD_NUM }}_${TIMESTAMP}.ipa"
        
        echo "📄 IPA filename: $IPA_NAME"
        
        # Create the IPA (ZIP file with .ipa extension)
        cd ipa_temp
        zip -r "../$IPA_NAME" Payload/ -q
        cd ..
        
        # Verify IPA was created
        if [ ! -f "$IPA_NAME" ]; then
          echo "❌ Failed to create IPA file"
          exit 1
        fi
        
        # Get file size
        IPA_SIZE=$(ls -lh "$IPA_NAME" | awk '{print $5}')
        
        echo "✅ IPA created successfully!"
        echo "📊 IPA Information:"
        echo "  📄 File: $IPA_NAME"
        echo "  📏 Size: $IPA_SIZE"
        echo "  📱 App: ${{ env.APP_NAME }}"
        echo "  🆔 Bundle ID: ${{ env.BUNDLE_ID }}"
        echo "  🔢 Version: ${{ env.VERSION }}"
        echo "  🏗️ Build: ${{ env.BUILD_NUM }}"
        
        # Verify IPA structure
        echo "🔍 IPA Contents:"
        unzip -l "$IPA_NAME" | grep -E "(Payload|\.app|SharedLogic)" | head -8
        
        # Export variables for artifacts
        echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT
        echo "ipa_size=$IPA_SIZE" >> $GITHUB_OUTPUT
        echo "success=true" >> $GITHUB_OUTPUT

    # ================================================
    # UPLOAD ARTIFACTS
    # ================================================
    
    - name: 📤 Upload IPA File
      if: steps.create-ipa.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: 📱-${{ env.APP_NAME }}-iOS-v${{ env.VERSION }}-build${{ env.BUILD_NUM }}
        path: iosApp/${{ steps.create-ipa.outputs.ipa_name }}
        retention-days: 30

    - name: 📋 Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 🛠️-Build-Logs-${{ env.BUILD_NUM }}
        path: |
          iosApp/build/xcodebuild.log
          iosApp/build/DerivedData/Build/Products
        retention-days: 7
        if-no-files-found: ignore

    # ================================================
    # SUCCESS SUMMARY
    # ================================================
    
    - name: 🎉 Build Complete
      if: steps.create-ipa.outputs.success == 'true'
      run: |
        echo ""
        echo "🎉 SUCCESS! iOS IPA Created Successfully!"
        echo "=============================================="
        echo ""
        echo "📱 App Details:"
        echo "  Name: ${{ env.APP_NAME }}"
        echo "  Bundle ID: ${{ env.BUNDLE_ID }}"
        echo "  Version: ${{ env.VERSION }}"
        echo "  Build Number: ${{ env.BUILD_NUM }}"
        echo "  File: ${{ steps.create-ipa.outputs.ipa_name }}"
        echo "  Size: ${{ steps.create-ipa.outputs.ipa_size }}"
        echo ""
        echo "📥 Download Instructions:"
        echo "  1. Scroll down to 'Artifacts' section"
        echo "  2. Click '📱-${{ env.APP_NAME }}-iOS-v${{ env.VERSION }}-build${{ env.BUILD_NUM }}'"
        echo "  3. Extract the downloaded ZIP to get your .ipa file"
        echo ""
        echo "📲 Installation Methods (Sideloading):"
        echo ""
        echo "  🪟 Windows Users:"
        echo "    • Sideloadly (recommended): sideloadly.io"
        echo "    • 3uTools: 3u.com"
        echo ""
        echo "  🍎 Mac Users:"
        echo "    • Xcode: Window → Devices and Simulators → Install App"
        echo ""
        echo "  📱 iPhone Users:"
        echo "    • AltStore: altstore.io"
        echo ""
        echo "⚠️  Important Notes:"
        echo "  • This is an UNSIGNED IPA for development/testing"
        echo "  • Requires sideloading tools to install on iOS devices"
        echo "  • No Apple Developer account needed to create"
        echo "  • Apps expire after 7 days (free Apple ID) or 1 year (paid Apple ID)"
        echo ""
        echo "🔧 Framework Status: ✅ SharedLogic framework embedded"
        echo "🚀 Your Kotlin Multiplatform app is ready for iOS!"

    - name: 📝 Generate Installation Guide
      if: steps.create-ipa.outputs.success == 'true'
      run: |
        cat > iosApp/INSTALLATION_GUIDE.md << 'EOF'
        # 📱 iOS Installation Guide
        
        ## App Information
        - **App Name:** ${{ env.APP_NAME }}
        - **Bundle ID:** ${{ env.BUNDLE_ID }}
        - **Version:** ${{ env.VERSION }}
        - **Build:** ${{ env.BUILD_NUM }}
        - **Created:** $(date)
        
        ## 📥 Download Your IPA
        1. Go to the GitHub Actions run page
        2. Scroll to the **Artifacts** section
        3. Download `📱-${{ env.APP_NAME }}-iOS-v${{ env.VERSION }}-build${{ env.BUILD_NUM }}`
        4. Extract the ZIP file to get your `.ipa` file
        
        ## 📲 Installation Options
        
        ### Option 1: Sideloadly (Windows/Mac) ⭐ Recommended
        1. Download Sideloadly from [sideloadly.io](https://sideloadly.io/)
        2. Connect your iPhone/iPad via USB
        3. Sign in with your Apple ID
        4. Drag your `.ipa` file to Sideloadly
        5. Click "Start" to install
        
        ### Option 2: 3uTools (Windows)
        1. Download 3uTools from [3u.com](https://www.3u.com/)
        2. Connect your device
        3. Go to "Apps" → "Install Local App"
        4. Select your `.ipa` file
        
        ### Option 3: Xcode (Mac Only)
        1. Open Xcode
        2. Go to Window → Devices and Simulators
        3. Select your connected device
        4. Click "+" and choose your `.ipa` file
        
        ### Option 4: AltStore (iPhone/iPad)
        1. Install AltStore from [altstore.io](https://altstore.io/)
        2. Use AltStore to sideload your `.ipa` file
        
        ## ⚠️ Important Notes
        
        ### Signing Requirements
        - This IPA is **unsigned** (development build)
        - You need your Apple ID to sign during installation
        - No paid Apple Developer account required
        
        ### App Expiration
        - **Free Apple ID:** Apps expire after 7 days
        - **Paid Apple Developer:** Apps expire after 1 year
        - You can re-install expired apps anytime
        
        ### Troubleshooting
        - If installation fails, ensure your device trusts your computer
        - Try different USB cables if connection issues occur
        - Make sure iOS version is compatible (iOS 13.0+)
        
        ## 🔧 Technical Details
        - **Framework:** SharedLogic framework properly embedded
        - **Architecture:** ARM64 (iOS devices)
        - **Minimum iOS:** 13.0
        - **Kotlin Multiplatform:** ✅ Included
        
        ---
        
        Generated by GitHub Actions for Kotlin Multiplatform iOS builds 🚀
        EOF

    - name: 📋 Upload Installation Guide
      if: steps.create-ipa.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: 📋-Installation-Guide-${{ env.BUILD_NUM }}
        path: iosApp/INSTALLATION_GUIDE.md
        retention-days: 30