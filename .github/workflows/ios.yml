name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Pre-compile Kotlin/Native to apply memory fixes and avoid Xcode build phase OOM crashes
      - name: Compile Kotlin/Native (all iOS targets)
        run: ./gradlew assembleIosSimulatorArm64Debug assembleIosX64Debug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx4g"

      # Replaces manual xcodebuild with the Marketplace action
      - name: KMP Build iOS App
        uses: openMF/mifos-x-actionhub-build-ios-app@v1.0.3
        with:
          build_type: Debug
          
          # Uncomment and configure the below fields via GitHub Secrets 
          # ONLY if you are building for Release / App Store / AdHoc
          
          # app_identifier: com.yourname.app
          # match_type: development
          # appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          # appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          # appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
