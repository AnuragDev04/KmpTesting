name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS App
    # macos-13 or macos-14 is recommended for latest Xcode versions
    runs-on: macos-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # Replaces manual caching steps with the official, optimized Gradle action
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # FIX: Run without daemon and allocate more memory to prevent OOM kills
      - name: Compile Kotlin/Native (all iOS targets)
        run: ./gradlew assembleIosSimulatorArm64Debug assembleIosX64Debug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx4g"

      # FIX: Specify a custom DerivedData path so we know exactly where the .app file will be output
      - name: Build Xcode project (iOS Simulator)
        run: |
          set -o pipefail && xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build/ios_simulator \
            | xcpretty

      # FIX: Point to the new DerivedData output path
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        if: always() # Uploads even if tests fail, but skips if preceding compilation crashed
        with:
          name: ios-simulator-app
          path: build/ios_simulator/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
