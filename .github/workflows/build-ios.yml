name: Build KMP iOS (Simulator)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build KMP XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleXCFramework

      # --- DEBUG: Shows you exactly what files exist ---
      - name: Debug directory structure
        run: |
          echo "Root files:"
          ls -la
          echo ""
          echo "Searching for iOS projects/workspaces:"
          find . -name "*.xcworkspace" -o -name "*.xcodeproj" | head -10

      # --- BUILD: Auto-detects workspace vs project ---
      - name: Build for iPhone Simulator
        run: |
          # Try to find the main workspace or project
          if [ -f "iosApp.xcworkspace" ]; then
            echo "Found iosApp.xcworkspace"
            xcodebuild build -workspace iosApp.xcworkspace -scheme iosApp -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          elif [ -f "iosApp.xcodeproj" ]; then
            echo "Found iosApp.xcodeproj"
            xcodebuild build -project iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          elif [ -f "composeApp/iosApp.xcworkspace" ]; then
            echo "Found composeApp/iosApp.xcworkspace"
            cd composeApp && xcodebuild build -workspace iosApp.xcworkspace -scheme iosApp -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            echo "ERROR: Could not find iosApp.xcworkspace or iosApp.xcodeproj!"
            echo "Here are all files in the root to help you debug:"
            ls -la
            exit 1
          fi

      - name: Zip Simulator App
        run: |
          # Find where the .app was built
          APP_PATH=$(find . -name "*.app" -path "*/Debug-iphonesimulator/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find .app file, searching manually..."
            find . -name "*.app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          zip -r ../../../ios-simulator-app.zip *.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios-simulator-app.zip
