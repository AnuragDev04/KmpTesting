name: Build KMP iOS (Simulator)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build KMP XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleXCFramework

      # ============================================================
      # FIXED: Build the iOS app by going INSIDE the iosApp folder
      # ============================================================
      - name: Build for iPhone Simulator
        run: |
          cd iosApp
          
          # Check if workspace exists
          if [ -f "iosApp.xcworkspace" ]; then
            echo "📱 Building with workspace: iosApp.xcworkspace"
            xcodebuild build \
              -workspace iosApp.xcworkspace \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          
          # Check if project exists
          elif [ -f "iosApp.xcodeproj" ]; then
            echo "📱 Building with project: iosApp.xcodeproj"
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          
          else
            echo "❌ ERROR: No .xcworkspace or .xcodeproj found inside iosApp/"
            echo "Files in this folder:"
            ls -la
            exit 1
          fi

      # ============================================================
      # FIXED: Zip the .app from the correct location inside iosApp/build
      # ============================================================
      - name: Zip Simulator App
        run: |
          # The app is built inside iosApp/build/Build/Products/Debug-iphonesimulator/
          APP_PATH="iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app"
          
          if [ -d "$APP_PATH" ]; then
            echo "✅ Found app at $APP_PATH"
            cd iosApp/build/Build/Products/Debug-iphonesimulator/
            zip -r ../../../../../ios-simulator-app.zip iosApp.app
          else
            echo "❌ Could not find iosApp.app, searching manually..."
            find . -name "*.app"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios-simulator-app.zip
