name: Build KMP iOS (Simulator)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build KMP XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleXCFramework

      # ============================================================
      # VERIFY: Confirm iosApp folder and Xcode project exist
      # ============================================================
      - name: Verify iosApp folder
        run: |
          echo "📂 Checking iosApp..."
          if [ ! -d "iosApp" ]; then
            echo "❌ iosApp directory not found at repo root."
            ls -la
            exit 1
          fi

          echo "✅ iosApp is a valid directory."
          ls -la iosApp

          if [ -d "iosApp/iosApp.xcworkspace" ] || [ -d "iosApp/iosApp.xcodeproj" ]; then
            echo "✅ Found Xcode project/workspace."
          else
            echo "❌ No .xcworkspace or .xcodeproj found inside iosApp/"
            echo "💡 Make sure iosApp.xcodeproj (or .xcworkspace) is committed to the repo."
            exit 1
          fi

      # ============================================================
      # BUILD: Now actually build the iOS app
      # ============================================================
      - name: Build for iPhone Simulator
        run: |
          cd iosApp

          if [ -d "iosApp.xcworkspace" ]; then
            echo "📱 Building with workspace..."
            xcodebuild build \
              -workspace iosApp.xcworkspace \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "iosApp.xcodeproj" ]; then
            echo "📱 Building with project..."
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "❌ ERROR: No .xcworkspace or .xcodeproj found inside iosApp/"
            ls -la
            exit 1
          fi

      - name: Zip Simulator App
        run: |
          APP_PATH="iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app"
          if [ -d "$APP_PATH" ]; then
            cd iosApp/build/Build/Products/Debug-iphonesimulator/
            zip -r ../../../../../ios-simulator-app.zip iosApp.app
          else
            echo "❌ App not found at $APP_PATH"
            find . -name "*.app"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios-simulator-app.zip
