name: Build KMP iOS (Simulator)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build KMP XCFramework (Fix permissions)
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleXCFramework
        # If your module isn't called "shared", change it here

      - name: Build for iPhone Simulator (No signing)
        working-directory: iosApp  # Change if your iOS folder has a different name
        run: |
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip Simulator App
        run: |
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../../ios-simulator-app.zip iosApp.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios-simulator-app.zip
