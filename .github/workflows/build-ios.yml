name: Build KMP iOS (Simulator)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build KMP XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleXCFramework

      # ============================================================
      # VERIFY: Confirm iosApp folder and Xcode project exist
      # ============================================================
      - name: Verify iosApp folder
        run: |
          echo "📂 Checking iosApp..."
          if [ ! -d "iosApp" ]; then
            echo "❌ iosApp directory not found at repo root."
            ls -la
            exit 1
          fi

          echo "✅ iosApp is a valid directory."
          ls -la iosApp

          if [ -d "iosApp/iosApp.xcworkspace" ] || [ -d "iosApp/iosApp.xcodeproj" ]; then
            echo "✅ Found Xcode project/workspace."
          else
            echo "❌ No .xcworkspace or .xcodeproj found inside iosApp/"
            echo "💡 Make sure iosApp.xcodeproj (or .xcworkspace) is committed to the repo."
            exit 1
          fi

      # ============================================================
      # BUILD: Now actually build the iOS app
      # ============================================================
      - name: Build for iPhone Simulator
        run: |
          cd iosApp

          if [ -d "iosApp.xcworkspace" ]; then
            echo "📱 Building with workspace..."
            xcodebuild build \
              -workspace iosApp.xcworkspace \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "iosApp.xcodeproj" ]; then
            echo "📱 Building with project..."
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "❌ ERROR: No .xcworkspace or .xcodeproj found inside iosApp/"
            ls -la
            exit 1
          fi

      # ============================================================
      # ZIP: Find the built .app dynamically (product name may not
      # match the scheme name, e.g. scheme "iosApp" -> CareHome.app)
      # ============================================================
      - name: Zip Simulator App
        run: |
          BUILD_DIR="iosApp/build/Build/Products/Debug-iphonesimulator"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "❌ Build products directory not found at $BUILD_DIR"
            find iosApp/build -maxdepth 4 -type d
            exit 1
          fi

          APP_NAME=$(find "$BUILD_DIR" -maxdepth 1 -name "*.app" -exec basename {} \; | head -1)

          if [ -z "$APP_NAME" ]; then
            echo "❌ No .app found in $BUILD_DIR"
            ls -la "$BUILD_DIR"
            exit 1
          fi

          echo "📦 Found app: $APP_NAME"
          cd "$BUILD_DIR"
          zip -r "$GITHUB_WORKSPACE/ios-simulator-app.zip" "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios-simulator-app.zip
