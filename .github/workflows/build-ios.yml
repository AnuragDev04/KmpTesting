name: Build KMP iOS (Simulator)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build KMP XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleXCFramework

      # ============================================================
      # FIX: Check if iosApp is a real folder or a stub file
      # ============================================================
      - name: Fix missing iosApp folder
        run: |
          echo "📂 Checking current iosApp type..."
          ls -ld iosApp
          
          # If it's a file (and not a directory), we need to recover it
          if [ -f "iosApp" ]; then
            echo "⚠️  iosApp is a regular file (stub). Searching for actual project..."
            
            # Check if the big zip file contains the Xcode project
            if unzip -l zipfile.zip | grep -q "\.xcodeproj"; then
              echo "✅ Found Xcode project inside zipfile.zip! Extracting..."
              unzip -q zipfile.zip -d ./extracted_ios
              # Find the actual iosApp folder inside the zip
              EXTRACTED_DIR=$(find ./extracted_ios -name "iosApp.xcodeproj" -o -name "iosApp.xcworkspace" | head -1 | xargs dirname)
              if [ -n "$EXTRACTED_DIR" ]; then
                echo "📁 Moving extracted iosApp to root..."
                rm -f iosApp  # Remove the stub file
                mv "$EXTRACTED_DIR" ./iosApp
              fi
            else
              echo "❌ No Xcode project found in zipfile.zip either!"
              echo "📝 Content of the iosApp stub file:"
              cat iosApp
              echo ""
              echo "💡 SOLUTION:"
              echo "  1. Commit the actual 'iosApp' folder from your local machine."
              echo "  2. Or run './gradlew createXcodeProject' to generate it."
              echo "  3. Then push the folder to GitHub."
              exit 1
            fi
          fi
          
          # Final verification
          if [ -d "iosApp" ]; then
            echo "✅ Success! iosApp is now a valid directory."
            ls -la iosApp | head -10
          else
            echo "❌ iosApp is still missing or invalid."
            exit 1
          fi

      # ============================================================
      # BUILD: Now actually build the iOS app
      # ============================================================
      - name: Build for iPhone Simulator
        run: |
          cd iosApp
          
          if [ -f "iosApp.xcworkspace" ]; then
            echo "📱 Building with workspace..."
            xcodebuild build \
              -workspace iosApp.xcworkspace \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -f "iosApp.xcodeproj" ]; then
            echo "📱 Building with project..."
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "❌ ERROR: No .xcworkspace or .xcodeproj found inside iosApp/"
            ls -la
            exit 1
          fi

      - name: Zip Simulator App
        run: |
          APP_PATH="iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app"
          if [ -d "$APP_PATH" ]; then
            cd iosApp/build/Build/Products/Debug-iphonesimulator/
            zip -r ../../../../../ios-simulator-app.zip iosApp.app
          else
            echo "❌ App not found at $APP_PATH"
            find . -name "*.app"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios-simulator-app.zip
