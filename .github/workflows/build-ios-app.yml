name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID'
        required: true
        default: 'com.example.carehome'
      app_name:
        description: 'App Name'
        required: true  
        default: 'CareHome'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Setup Build Environment
      run: |
        chmod +x ./gradlew
        echo "📋 Xcode version:"
        xcodebuild -version
        echo "📋 Available SDKs:"
        xcodebuild -showsdks

    - name: 📦 Build Kotlin Multiplatform Framework
      run: |
        echo "🏗️ Building shared framework..."
        ./gradlew :sharedLogic:assembleXCFramework --no-daemon --stacktrace
        echo "✅ Framework built successfully"

    - name: 📱 Configure iOS Project
      run: |
        cd iosApp
        
        BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
        APP_NAME="${{ github.event.inputs.app_name }}"
        
        echo "📱 Configuring iOS project:"
        echo "   Bundle ID: $BUNDLE_ID"
        echo "   App Name: $APP_NAME"
        echo "   Build Number: ${{ github.run_number }}"
        
        # Create proper Info.plist
        cat > iosApp/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>$APP_NAME</string>
            <key>CFBundleExecutable</key>
            <string>iosApp</string>
            <key>CFBundleIdentifier</key>
            <string>$BUNDLE_ID</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$APP_NAME</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationPortraitUpsideDown</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CADisableMinimumFrameDurationOnPhone</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
                <key>NSAllowsArbitraryLoads</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF
        
        echo "✅ iOS project configured"

    - name: 🏗️ Build iOS App (Unsigned)
      run: |
        cd iosApp
        
        echo "🏗️ Building unsigned iOS app..."
        
        # Clean previous builds
        rm -rf build/
        
        # Build for device without signing
        echo "📱 Building for iOS device..."
        xcodebuild \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          build \
          | tee build-device.log
        
        if [ $? -eq 0 ]; then
          echo "✅ Device build successful"
          DEVICE_BUILD_SUCCESS=true
        else
          echo "❌ Device build failed"
          DEVICE_BUILD_SUCCESS=false
        fi
        
        # Build for simulator as backup
        echo "📱 Building for iOS simulator..."
        xcodebuild \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build/DerivedDataSim \
          build \
          | tee build-simulator.log
        
        if [ $? -eq 0 ]; then
          echo "✅ Simulator build successful" 
          SIMULATOR_BUILD_SUCCESS=true
        else
          echo "❌ Simulator build failed"
          SIMULATOR_BUILD_SUCCESS=false
        fi
        
        # Check if at least one build succeeded
        if [ "$DEVICE_BUILD_SUCCESS" = false ] && [ "$SIMULATOR_BUILD_SUCCESS" = false ]; then
          echo "❌ Both builds failed"
          echo "📋 Device build log:"
          cat build-device.log
          echo ""
          echo "📋 Simulator build log:"
          cat build-simulator.log
          exit 1
        fi
        
        echo "✅ iOS app build completed"

    - name: 📦 Create IPA File
      id: create_ipa
      run: |
        cd iosApp
        
        echo "📦 Creating IPA file..."
        
        # Find the built app
        DEVICE_APP=""
        SIMULATOR_APP=""
        
        if [ -d "build/DerivedData/Build/Products/Release-iphoneos/iosApp.app" ]; then
          DEVICE_APP="build/DerivedData/Build/Products/Release-iphoneos/iosApp.app"
          echo "✅ Found device app: $DEVICE_APP"
        fi
        
        if [ -d "build/DerivedDataSim/Build/Products/Release-iphonesimulator/iosApp.app" ]; then
          SIMULATOR_APP="build/DerivedDataSim/Build/Products/Release-iphonesimulator/iosApp.app"
          echo "✅ Found simulator app: $SIMULATOR_APP"
        fi
        
        # Create IPA from device build (preferred)
        if [ -n "$DEVICE_APP" ] && [ -d "$DEVICE_APP" ]; then
          echo "📱 Creating IPA from device build..."
          
          # Create IPA structure
          mkdir -p build/ipa/Payload
          cp -R "$DEVICE_APP" build/ipa/Payload/
          
          # Create IPA file (it's just a ZIP with .ipa extension)
          cd build/ipa
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          IPA_NAME="${{ github.event.inputs.app_name }}_Unsigned_${TIMESTAMP}_build${{ github.run_number }}.ipa"
          
          zip -r "$IPA_NAME" Payload/
          
          if [ -f "$IPA_NAME" ]; then
            echo "✅ Device IPA created successfully: $IPA_NAME"
            ls -lh "$IPA_NAME"
            echo "ipa_success=true" >> $GITHUB_OUTPUT
            echo "ipa_path=build/ipa/$IPA_NAME" >> $GITHUB_OUTPUT
            echo "ipa_type=device" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to create device IPA"
          fi
          
          cd ../..
          
        # Fallback: Create IPA from simulator build
        elif [ -n "$SIMULATOR_APP" ] && [ -d "$SIMULATOR_APP" ]; then
          echo "📱 Creating IPA from simulator build..."
          
          mkdir -p build/ipa/Payload
          cp -R "$SIMULATOR_APP" build/ipa/Payload/
          
          cd build/ipa
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          IPA_NAME="${{ github.event.inputs.app_name }}_Simulator_${TIMESTAMP}_build${{ github.run_number }}.ipa"
          
          zip -r "$IPA_NAME" Payload/
          
          if [ -f "$IPA_NAME" ]; then
            echo "✅ Simulator IPA created successfully: $IPA_NAME"
            ls -lh "$IPA_NAME"
            echo "ipa_success=true" >> $GITHUB_OUTPUT
            echo "ipa_path=build/ipa/$IPA_NAME" >> $GITHUB_OUTPUT
            echo "ipa_type=simulator" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to create simulator IPA"
          fi
          
          cd ../..
        else
          echo "❌ No app found to create IPA"
          echo "ipa_success=false" >> $GITHUB_OUTPUT
        fi

    - name: 🔍 Verify IPA Contents
      if: steps.create_ipa.outputs.ipa_success == 'true'
      run: |
        cd iosApp
        
        echo "🔍 Verifying IPA contents..."
        IPA_PATH="${{ steps.create_ipa.outputs.ipa_path }}"
        
        if [ -f "$IPA_PATH" ]; then
          echo "📦 IPA file: $IPA_PATH"
          echo "📊 IPA size: $(ls -lh "$IPA_PATH" | awk '{print $5}')"
          
          # Extract and show contents
          mkdir -p build/verify
          cd build/verify
          unzip -q "../../${{ steps.create_ipa.outputs.ipa_path }}"
          
          echo "📁 IPA structure:"
          find Payload -type f | head -20
          
          if [ -d "Payload/iosApp.app" ]; then
            echo "✅ App bundle found in IPA"
            echo "📱 App info:"
            ls -la Payload/iosApp.app/
            
            if [ -f "Payload/iosApp.app/Info.plist" ]; then
              echo "📋 Bundle information:"
              plutil -p Payload/iosApp.app/Info.plist | head -10
            fi
          else
            echo "❌ App bundle not found in IPA"
          fi
          
          cd ../..
        else
          echo "❌ IPA file not found at $IPA_PATH"
        fi

    - name: 📋 Build Summary
      run: |
        cd iosApp
        
        echo "📋 Build Summary"
        echo "================"
        echo "📱 App Name: ${{ github.event.inputs.app_name }}"
        echo "📦 Bundle ID: ${{ github.event.inputs.bundle_id }}"
        echo "🔢 Build Number: ${{ github.run_number }}"
        echo "📅 Date: $(date)"
        echo ""
        
        if [ "${{ steps.create_ipa.outputs.ipa_success }}" = "true" ]; then
          echo "✅ SUCCESS: IPA file created!"
          echo "📱 IPA Type: ${{ steps.create_ipa.outputs.ipa_type }}"
          echo "📁 IPA Location: ${{ steps.create_ipa.outputs.ipa_path }}"
          
          IPA_SIZE=$(ls -lh "${{ steps.create_ipa.outputs.ipa_path }}" | awk '{print $5}')
          echo "📦 IPA Size: $IPA_SIZE"
          
          echo ""
          echo "🔧 Installation Notes:"
          if [ "${{ steps.create_ipa.outputs.ipa_type }}" = "device" ]; then
            echo "   📱 UNSIGNED DEVICE IPA"
            echo "   ✅ Can be sideloaded to real iOS devices"
            echo "   🛠️ Requires sideloading tools:"
            echo "      - AltStore (iOS)"
            echo "      - Sideloadly (Windows/Mac)"
            echo "      - 3uTools (Windows/Mac)"
            echo "      - Xcode (Mac - for development devices)"
          else
            echo "   📱 SIMULATOR IPA"
            echo "   ⚠️ Only works in iOS Simulator"
            echo "   🛠️ Cannot be installed on real devices"
            echo "   ✅ Good for testing app structure"
          fi
          
        else
          echo "❌ FAILED: Could not create IPA file"
          echo ""
          echo "🔍 Troubleshooting:"
          echo "   - Check build logs for compilation errors"
          echo "   - Verify Kotlin framework built successfully"
          echo "   - Check iOS project configuration"
        fi

    - name: 📤 Upload IPA File
      if: steps.create_ipa.outputs.ipa_success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: 📱 iOS-IPA-${{ github.run_number }}
        path: |
          iosApp/${{ steps.create_ipa.outputs.ipa_path }}
        retention-days: 30

    - name: 📤 Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 📋 Build-Logs-${{ github.run_number }}
        path: |
          iosApp/build-*.log
        retention-days: 7

    - name: 🎉 Success Message
      if: steps.create_ipa.outputs.ipa_success == 'true'
      run: |
        echo ""
        echo "🎉 SUCCESS! Your iOS app has been built!"
        echo ""
        echo "📥 Download Instructions:"
        echo "   1. Go to this workflow run"
        echo "   2. Scroll to 'Artifacts' section"
        echo "   3. Download '📱 iOS-IPA-${{ github.run_number }}'"
        echo "   4. Extract ZIP to get your .ipa file"
        echo ""
        echo "📱 Your ${{ github.event.inputs.app_name }} app is ready!"
        echo ""
        if [ "${{ steps.create_ipa.outputs.ipa_type }}" = "device" ]; then
          echo "🚀 This IPA can be sideloaded to real iOS devices!"
        else
          echo "🧪 This IPA is for simulator testing only."
        fi